name: CI

# PR + push gate. Runs on every push to main/develop and every pull request:
#   - install
#   - lint (biome)
#   - typecheck (tsc --noEmit)
#   - tests (vitest)
#   - lib build (tsup → dist/)
#   - docs build (astro + pagefind + llms manifest)

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build lib
        run: pnpm build

      - name: Build docs
        run: pnpm docs:build
